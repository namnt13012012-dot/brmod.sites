<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRMOD — Lấy Khóa Kích Hoạt</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050816;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding-top: 30px;
    }

    h1 {
      text-align: center;
      color: #22c55e;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .card {
      background: #0f172a;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      border: 1px solid #1e293b;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #1e293b;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .val-green {
      color: #22c55e;
      font-weight: bold;
    }

    .val-yellow {
      color: #eab308;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-primary {
      background: #22c55e;
      color: #000;
    }

    .btn-primary:hover {
      background: #16a34a;
    }

    .btn-primary:disabled {
      background: #475569;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .result.success {
      background: #14532d;
      border: 1px solid #22c55e;
      display: block;
    }

    .result.error {
      background: #7f1d1d;
      border: 1px solid #ef4444;
      display: block;
    }

    .key-box {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      padding: 12px;
      background: #000;
      border-radius: 6px;
      margin: 10px 0;
      letter-spacing: 2px;
      color: #22c55e;
    }

    .countdown {
      text-align: center;
      margin-top: 10px;
      color: #94a3b8;
    }

    .yt-link {
      text-align: center;
      margin-top: 20px;
    }

    .yt-link a {
      color: #3b82f6;
      text-decoration: none;
    }

    .loading {
      text-align: center;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #333;
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔑 BRMOD — Lấy Khóa Kích Hoạt</h1>
    <p class="subtitle">Hệ thống chống tự động lấy khóa — HMAC-SHA256</p>

    <div class="card">
      <div class="stat-row">
        <span>Trạng thái hệ thống</span>
        <span id="sys-status" class="val-green">Đang trực tuyến</span>
      </div>
      <div class="stat-row">
        <span>Số khóa còn lại</span>
        <span id="avail-keys">---</span>
      </div>
      <div class="stat-row">
        <span>Giới hạn / IP</span>
        <span id="ip-limit">2 khóa / ngày</span>
      </div>
      <div class="stat-row">
        <span>Đã nhận hôm nay</span>
        <span id="ip-used" class="val-yellow">0 / 2</span>
      </div>
    </div>

    <div class="card">
      <button id="claim-btn" class="btn-primary" onclick="claimKey()">
        NHẬN KHÓA MIỄN PHÍ
      </button>
      
      <div class="loading" id="loading">
        Đang xử lý...
        <span class="spinner"></span>
      </div>
      
      <div id="result-box" class="result">
        <p id="result-msg"></p>
        <div id="key-display" class="key-box"></div>
        <p id="expire-info"></p>
      </div>
    </div>

    <div class="yt-link">
      <p>
        Kênh hỗ trợ:
        <a id="yt-channel" href="" target="_blank">@quocthaipc</a>
      </p>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let waitTime = 0;
    let timer = null;

    // === Tải thông tin hệ thống ===
    async function loadInfo() {
      try {
        const res = await fetch(`${API}/info`);
        const data = await res.json();
        
        document.getElementById('avail-keys').textContent = data.availableKeys;
        document.getElementById('ip-used').textContent = 
          `${data.ipClaimsToday} / ${data.maxKeysPerIp}`;
        document.getElementById('yt-channel').href = data.youtube.channelUrl;
        document.getElementById('ip-limit').textContent = 
          `${data.maxKeysPerIp} khóa / ngày`;
        
        if (data.iplimitReached) {
          const btn = document.getElementById('claim-btn');
          btn.disabled = true;
          btn.textContent = 'ĐÃ ĐẠT GIỚI HẠN';
        }
      } catch (e) {
        const status = document.getElementById('sys-status');
        status.textContent = 'Mất kết nối';
        status.className = 'val-yellow';
      }
    }

    // === Đếm ngược chống nhấn liên tục ===
    function startCountdown(seconds) {
      waitTime = seconds;
      const btn = document.getElementById('claim-btn');
      btn.disabled = true;
      
      timer = setInterval(() => {
        waitTime--;
        btn.textContent = `Vui lòng đợi ${waitTime}s...`;
        
        if (waitTime <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = 'NHẬN KHÓA MIỄN PHÍ';
        }
      }, 1000);
    }

    // === Nhận khóa ===
    async function claimKey() {
      if (waitTime > 0) return;
      
      const btn = document.getElementById('claim-btn');
      const loading = document.getElementById('loading');
      const resultBox = document.getElementById('result-box');
      const resultMsg = document.getElementById('result-msg');
      const keyDisplay = document.getElementById('key-display');
      const expireInfo = document.getElementById('expire-info');
      
      btn.disabled = true;
      btn.style.display = 'none';
      loading.style.display = 'block';
      resultBox.style.display = 'none';

      try {
        // Bước 1: Lấy token HMAC
        const tokenRes = await fetch(`${API}/GenerateT`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'claim' })
        });
        const [token, timestamp] = await tokenRes.json();

        // Bước 2: Gọi nhận khóa
        const keyRes = await fetch(`${API}/claim-key`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, timestamp })
        });

        const data = await keyRes.json();

        loading.style.display = 'none';
        btn.style.display = 'block';

        if (data.success) {
          resultBox.className = 'result success';
          resultMsg.textContent = '✅ Nhận khóa thành công!';
          keyDisplay.textContent = data.key.key;
          
          const exp = new Date(data.key.expiresAt);
          expireInfo.textContent = 
            `Hết hạn: ${exp.toLocaleString('vi-VN')}`;
          
          startCountdown(10);
        } else {
          resultBox.className = 'result error';
          resultMsg.textContent = '❌ ' + data.error;
          
          if (data.error.includes('giới hạn')) {
            btn.disabled = true;
            btn.textContent = 'Đã hết lượt nhận';
          }
        }
      } catch (err) {
        loading.style.display = 'none';
        btn.style.display = 'block';
        resultBox.className = 'result error';
        resultMsg.textContent = '❌ Lỗi kết nối, thử lại sau';
      }

      loadInfo();
    }

    // === Khởi động ===
    loadInfo();
  </script>
</body>
</html>
