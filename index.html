<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRMOD — Lấy Khóa & Tải Công Cụ</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050816;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding-top: 30px;
    }

    h1 {
      text-align: center;
      color: #22c55e;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .card {
      background: #0f172a;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      border: 1px solid #1e293b;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #1e293b;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .val-green { color: #22c55e; font-weight: bold; }
    .val-yellow { color: #eab308; font-weight: bold; }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      margin-top: 10px;
    }

    .btn-primary { background: #22c55e; color: #000; }
    .btn-primary:hover { background: #16a34a; }
    .btn-primary:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; }

    .btn-download { background: #3b82f6; color: #fff; display: none; }
    .btn-download:hover { background: #2563eb; }

    .btn-link4m { background: #f59e0b; color: #000; display: none; }
    .btn-link4m:hover { background: #d97706; }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .result.success {
      background: #14532d;
      border: 1px solid #22c55e;
      display: block;
    }

    .result.error {
      background: #7f1d1d;
      border: 1px solid #ef4444;
      display: block;
    }

    .key-box {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      padding: 12px;
      background: #000;
      border-radius: 6px;
      margin: 10px 0;
      letter-spacing: 2px;
      color: #22c55e;
    }

    .loading {
      text-align: center;
      display: none;
      padding: 15px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #333;
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .yt-link {
      text-align: center;
      margin-top: 20px;
    }

    .yt-link a { color: #3b82f6; text-decoration: none; }
    .note { margin-top: 15px; font-size: 13px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔑 BRMOD — Lấy Khóa & Tải Công Cụ</h1>
    <p class="subtitle">Bước 1: Nhận khóa → Bước 2: Mở Link4m → Bước 3: Tải công cụ</p>

    <div class="card">
      <div class="stat-row">
        <span>Trạng thái hệ thống</span>
        <span id="sys-status" class="val-green">Đang trực tuyến</span>
      </div>
      <div class="stat-row">
        <span>Số khóa còn lại</span>
        <span id="avail-keys" class="val-yellow">---</span>
      </div>
      <div class="stat-row">
        <span>Đã nhận hôm nay</span>
        <span id="ip-used" class="val-yellow">0 / 2</span>
      </div>
    </div>

    <div class="card">
      <button id="claim-btn" class="btn-primary" onclick="claimKey()">
        BƯỚC 1: NHẬN KHÓA
      </button>
      
      <div class="loading" id="loading">
        Đang xử lý... <span class="spinner"></span>
      </div>
      
      <div id="result-box" class="result">
        <p id="result-msg"></p>
        <div id="key-display" class="key-box"></div>
        <p id="expire-info" style="text-align:center; color:#94a3b8; font-size:14px;"></p>
      </div>

      <!-- Bước 2: Link4m — HIỆN SAU KHI CÓ KEY -->
      <button id="link4m-btn" class="btn-link4m" onclick="openLink4m()">
        BƯỚC 2: MỞ LINK4M → NHẬN LINK TẢI
      </button>

      <!-- Bước 3: Tải xuống — HIỆN SAU KHI BƯỚC 2 -->
      <button id="download-btn" class="btn-download" onclick="openDownload()">
        BƯỚC 3: TẢI CÔNG CỤ VỀ MÁY
      </button>
    </div>

    <p class="note">💡 Sau khi có khóa, bạn phải qua Link4m rồi mới thấy link tải chính thức</p>

    <div class="yt-link">
      <p>Kênh hỗ trợ: <a id="yt-channel" href="#" target="_blank">@quocthaipc</a></p>
    </div>
  </div>

  <script>
    // ===== CẤU HÌNH LINK CỦA BẠN =====
    const LINK4M_URL = 'https://link4m.com/your-link-day-ngay'; // 🔄 SỬA LINK CỦA BẠN
    const DOWNLOAD_URL = 'https://link-tai-cong-cu-cua-ban.com'; // 🔄 SỬA LINK TẢI CỦA BẠN

    const API = window.location.origin;
    let waitTime = 0;
    let timer = null;

    // Tải thông tin hệ thống
    async function loadInfo() {
      try {
        const res = await fetch(`${API}/info`);
        const data = await res.json();
        
        document.getElementById('avail-keys').textContent = data.availableKeys;
        document.getElementById('ip-used').textContent = `${data.ipClaimsToday} / ${data.maxKeysPerIp}`;
        document.getElementById('yt-channel').href = data.youtube.channelUrl;
        
        if (data.iplimitReached) {
          document.getElementById('claim-btn').disabled = true;
          document.getElementById('claim-btn').textContent = 'ĐÃ ĐẠT GIỚI HẠN — Đợi ngày mai';
        }
      } catch (e) {
        const status = document.getElementById('sys-status');
        status.textContent = 'Mất kết nối';
        status.className = 'val-yellow';
      }
    }

    // Đếm ngược
    function startCountdown(seconds) {
      waitTime = seconds;
      const btn = document.getElementById('claim-btn');
      btn.disabled = true;
      
      timer = setInterval(() => {
        waitTime--;
        btn.textContent = `Đợi ${waitTime}s...`;
        if (waitTime <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = 'BƯỚC 1: NHẬN KHÓA';
        }
      }, 1000);
    }

    // Mở Link4m
    function openLink4m() {
      window.open(LINK4M_URL, '_blank');
      // Hiện nút Tải sau khi mở Link4m
      document.getElementById('download-btn').style.display = 'block';
    }

    // Mở link Tải
    function openDownload() {
      window.open(DOWNLOAD_URL, '_blank');
    }

    // Nhận khóa
    async function claimKey() {
      if (waitTime > 0) return;
      
      const btn = document.getElementById('claim-btn');
      const loading = document.getElementById('loading');
      const resultBox = document.getElementById('result-box');
      const link4mBtn = document.getElementById('link4m-btn');
      
      btn.disabled = true;
      btn.style.display = 'none';
      loading.style.display = 'block';
      resultBox.style.display = 'none';
      link4mBtn.style.display = 'none';
      document.getElementById('download-btn').style.display = 'none';

      try {
        // Lấy token bảo mật
        const tRes = await fetch(`${API}/GenerateT`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'claim' })
        });
        const [token, timestamp] = await tRes.json();

        // Nhận key
        const res = await fetch(`${API}/claim-key`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, timestamp })
        });

        const data = await res.json();

        loading.style.display = 'none';
        btn.style.display = 'block';

        if (data.success) {
          resultBox.className = 'result success';
          resultBox.style.display = 'block';
          document.getElementById('result-msg').textContent = '✅ Nhận khóa thành công!';
          document.getElementById('key-display').textContent = data.key.key;
          
          const exp = new Date(data.key.expiresAt);
          document.getElementById('expire-info').textContent = 
            `Hạn sử dụng: ${exp.toLocaleString('vi-VN')}`;

          // ✅ HIỆN NÚT BƯỚC 2 — Link4m
          link4mBtn.style.display = 'block';
          
          startCountdown(10);
        } else {
          resultBox.className = 'result error';
          resultBox.style.display = 'block';
          document.getElementById('result-msg').textContent = '❌ ' + data.error;
          
          if (data.error.includes('giới hạn')) {
            btn.disabled = true;
            btn.textContent = 'Đã hết lượt nhận';
          }
        }
      } catch (err) {
        loading.style.display = 'none';
        btn.style.display = 'block';
        resultBox.className = 'result error';
        resultBox.style.display = 'block';
        document.getElementById('result-msg').textContent = '❌ Lỗi kết nối, thử lại sau';
      }

      loadInfo();
    }

    // Khởi động
    loadInfo();
  </script>
</body>
</html>
